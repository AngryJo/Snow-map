<style>
:root{
  --bg:#070f1d;--panel:#0d1a2e;--card:#091525;--border:#1a2e4a;
  --text:#ddeeff;--sub:#5a7ea0;--accent:#3b82f6;
  --done-color:#10b981;--work-color:#3b82f6;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',system-ui,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ── Snowflakes ── */
#snow{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.flake{position:absolute;top:-30px;animation:fall linear infinite;user-select:none;color:#a8d8f0}
@keyframes fall{to{transform:translateY(110dvh) rotate(360deg)}}

/* ── Top bar ── */
#topbar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(env(safe-area-inset-top,0px),10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--border);z-index:200;
}
.app-title{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:-.5px}
.hud{display:flex;align-items:center;gap:7px}
.hud-km{font-size:.68rem;color:var(--sub);white-space:nowrap}
.pbar{width:65px;height:7px;background:var(--border);border-radius:4px;overflow:hidden;flex-shrink:0}
.pbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#10b981);transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.pbar-txt{font-size:.68rem;color:var(--sub);min-width:28px;text-align:right;white-space:nowrap}

/* ── Map ── */
#map{flex:1;min-height:0}

/* Worker icons (Leaflet divIcon) */
.w-icon{
  width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.75rem;color:#fff;
  animation:wpulse 2s infinite;
}
.w-icon.me{background:#2563eb;border-color:#93c5fd}
.w-icon.other{background:#0f766e;border-color:#5eead4}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 7px rgba(59,130,246,0)}}

/* Route line animations on Leaflet SVG paths */
.rl-working{stroke-dasharray:20 10!important;animation:dashflow 1.2s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-30}}

/* ── Bottom panel ── */
#panel{
  flex-shrink:0;background:var(--panel);border-top:2px solid var(--border);
  display:flex;flex-direction:column;max-height:44vh;min-height:140px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),4px);
}
.panel-drag{padding:7px 0 2px;text-align:center;cursor:ns-resize;flex-shrink:0}
.panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto}
#cards{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
#panel-foot{padding:6px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;flex-shrink:0}

/* ── Route card ── */
.rcard{
  display:flex;align-items:center;gap:7px;padding:7px 9px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  transition:border-color .25s,background .25s;cursor:pointer;
}
.rcard:hover{background:rgba(255,255,255,.03)}
.rcard.working{border-color:var(--work-color);background:rgba(59,130,246,.07);animation:cpulse 2s infinite}
.rcard.done{border-color:var(--done-color);background:rgba(16,185,129,.07)}
@keyframes cpulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px rgba(59,130,246,.2)}}
.rdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rnum{font-size:.6rem;color:var(--sub);flex-shrink:0;min-width:10px}
.rinfo{flex:1;min-width:0}
.rname{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlbl{font-size:.6rem;color:var(--sub)}
.rkm{font-size:.6rem;color:var(--sub);flex-shrink:0;margin-right:3px}
.rbg{display:flex;gap:3px;flex-shrink:0}
.rbtn{
  padding:3px 6px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--sub);border-radius:5px;font-size:.6rem;cursor:pointer;
  transition:all .15s;white-space:nowrap;font-family:inherit;
}
.rbtn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.rbtn.on-wt{background:rgba(255,255,255,.1);border-color:#64748b;color:var(--text);font-weight:600}
.rbtn.on-w{background:rgba(59,130,246,.25);border-color:var(--accent);color:#93c5fd;font-weight:600}
.rbtn.on-d{background:rgba(16,185,129,.2);border-color:#059669;color:#6ee7b7;font-weight:600}

/* ── GPS + reset footer ── */
.pfbtn{
  flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--sub);font-size:.75rem;
  cursor:pointer;transition:all .2s;font-family:inherit;font-weight:600;
}
.pfbtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.pfbtn.gps-on{background:rgba(59,130,246,.2);border-color:var(--accent);color:#93c5fd}

/* ── Modals ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal-bg[hidden]{display:none!important}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:22px;width:100%;max-width:300px;
}
.modal h3{font-size:.95rem;font-weight:700;margin-bottom:5px}
.modal p{font-size:.75rem;color:var(--sub);margin-bottom:14px;line-height:1.5}
.modal input{
  width:100%;padding:10px 12px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:.9rem;margin-bottom:11px;font-family:inherit;outline:none;
}
.modal input:focus{border-color:var(--accent)}
.modal .brow{display:flex;gap:8px}
.modal .brow button{
  flex:1;padding:9px;border-radius:8px;border:none;font-size:.82rem;
  font-family:inherit;cursor:pointer;font-weight:600;
}
.mbtn-x{background:var(--border);color:var(--sub)}
.mbtn-ok{background:var(--accent);color:#fff}

/* ── Toast ── */
#toast{
  position:fixed;bottom:50vh;left:50%;transform:translateX(-50%);
  background:rgba(5,150,105,.92);color:#fff;padding:7px 16px;
  border-radius:20px;font-size:.78rem;font-weight:600;z-index:999;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1}

/* ── Burst ── */
.burst{position:fixed;pointer-events:none;z-index:998;font-size:1.6rem;animation:brst .9s forwards}
@keyframes brst{0%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(2.2) translateY(-50px)}}

/* ── Save indicator ── */
#sync{
  position:fixed;top:max(env(safe-area-inset-top,0px),10px);
  right:max(env(safe-area-inset-right,0px),10px);
  font-size:.6rem;color:var(--sub);opacity:0;transition:opacity .3s;
  z-index:201;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:10px;
}
#sync.show{opacity:1}

/* ── Connection badge ── */
#conn-badge{
  position:fixed;bottom:calc(44vh + 46px);right:max(16px,env(safe-area-inset-right,0px));
  font-size:.6rem;padding:3px 8px;border-radius:10px;z-index:300;
  opacity:0;transition:opacity .4s;pointer-events:none;
}
#conn-badge.show{opacity:1}
#conn-badge.ok{background:rgba(16,185,129,.18);color:#6ee7b7;border:1px solid #059669}
#conn-badge.err{background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid #dc2626}

/* ── Leaflet overrides ── */
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:6px!important}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)}
.leaflet-popup-content{font-family:'Noto Sans KR',system-ui;font-size:.8rem;line-height:1.5}
.leaflet-tooltip{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans KR',system-ui;font-size:.75rem;border-radius:6px;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.leaflet-tooltip-top:before{border-top-color:var(--border)}
</style>

<!-- Snowflakes -->
</head>
<body>
<div id="snow"></div>

<!-- Top bar -->
<div id="topbar">
  <div class="app-title">❄️ 세종대왕면 제설 작전</div>
  <div class="hud">
    <span class="hud-km" id="hud-km">0.0/24.9km</span>
    <div class="pbar"><div class="pbar-fill" id="pbar-fill"></div></div>
    <span class="pbar-txt" id="pbar-txt">0/7</span>
  </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Bottom panel -->
<div id="panel">
  <div class="panel-drag" id="panel-drag"><div class="panel-handle"></div></div>
  <div id="cards"></div>
  <div id="panel-foot">
    <button class="pfbtn" id="gps-btn" onclick="toggleGps()">📍 위치 공유</button>
    <button class="pfbtn" onclick="zoomAll()" style="flex:.5">🗺️ 전체보기</button>
  </div>
</div>

<!-- Name modal -->
<div class="modal-bg" id="modal-name" hidden>
  <div class="modal">
    <h3>작업자 이름</h3>
    <p>지도에 표시될 이름을 입력해 주세요.</p>
    <input type="text" id="name-inp" placeholder="이름 (예: 김철수)" maxlength="8" autocomplete="off">
    <div class="brow">
      <button class="mbtn-x" onclick="cancelName()">취소</button>
      <button class="mbtn-ok" onclick="confirmName()">확인 →</button>
    </div>
  </div>
</div>

<!-- Toast / Sync / Badge -->
<div id="toast"></div>
<div id="sync">저장 중...</div>
<div id="conn-badge"></div>

<script>
/* ═══════════════════════════════════════════

  [[127.57883,37.298903],[127.57879,37.296214],[127.57235,37.295406],[127.571468,37.295438],[127.571295,37.295374],[127.571201,37.295194],[127.571188,37.294184],[127.572417,37.294216],[127.573753,37.294046],[127.57378,37.295587],[127.577494,37.296033],[127.577494,37.294599],[127.576225,37.294588],[127.576278,37.296671],[127.576104,37.29783],[127.576158,37.298138]],

  [[127.585423,37.267095],[127.581364,37.268464],[127.579091,37.270079],[127.578429,37.270448],[127.577856,37.270712],[127.575186,37.271186],[127.573885,37.271502],[127.572097,37.271923],[127.571016,37.272327],[127.56464,37.27568],[127.564045,37.275979],[127.563317,37.276189],[127.562147,37.276242]],

  [[127.5393,37.247641],[127.539623,37.24798],[127.540034,37.248739],[127.540606,37.249311],[127.540783,37.249779],[127.541326,37.250316],[127.541487,37.250655],[127.541443,37.251449],[127.541017,37.252232],[127.540959,37.252711],[127.540915,37.252933],[127.539315,37.254872],[127.539197,37.255176],[127.5393,37.255538],[127.540386,37.256391],[127.540606,37.256671],[127.540548,37.257068],[127.53955,37.257688],[127.53886,37.258505],[127.538581,37.258669],[127.538214,37.258704],[127.537348,37.258482],[127.536585,37.258061],[127.536174,37.257921],[127.535866,37.257886],[127.53453,37.258003],[127.532226,37.25937]]

// Convert GeoJSON [lng,lat] → Leaflet [lat,lng]
const COORDS=GJ.map(pts=>pts.map(c=>[c[1],c[0]]));

/* ═══════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════ */
let db=null,userId=null,userName=null;
let gpsActive=false,gpsWatchId=null;
const statuses={1:'대기',2:'대기',3:'대기',4:'대기',5:'대기',6:'대기',7:'대기'};
const polylines={};
const workerMarkers={};

/* ═══════════════════════════════════════════
   MAP SETUP
═══════════════════════════════════════════ */
const map=L.map('map',{
  center:[37.278,127.573],zoom:12,
  zoomControl:true,attributionControl:true,
});
L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/73D40734-7942-4E81-9C93-5F897F940DCB/Midnight/{z}/{y}/{x}.png',{
  attribution:'© <a href="https://www.vworld.kr">국토지리정보원</a>',
  maxZoom:18,
}).addTo(map);

function getStyle(routeIdx,status){
  const c=ROUTES[routeIdx].color;
  if(status==='완료') return {color:'#00E676',weight:7,opacity:.95,dashArray:null};
  if(status==='작업중') return {color:c,weight:8,opacity:1,dashArray:'20 10'};
  return {color:'#2a3f58',weight:4,opacity:.6,dashArray:'8 6'};
}

function initRoutes(){
  ROUTES.forEach((r,i)=>{
    const pl=L.polyline(COORDS[i],{...getStyle(i,'대기'),className:`rl rl-${r.id}`}).addTo(map);
    pl.on('click',()=>focusCard(r.id));
    pl.bindTooltip(`<b>${r.id}. ${r.name}</b><br>${r.label}<br>${r.km}km`,{sticky:true});
    polylines[r.id]=pl;
  });
  // Fit all routes
  const all=COORDS.flat();
  map.fitBounds(L.latLngBounds(all),{padding:[24,24]});
}

function applyRouteStyle(id,status){
  const idx=id-1;
  const pl=polylines[id];
  if(!pl) return;
  pl.setStyle(getStyle(idx,status));
  // Animation class for 작업중
  const el=pl.getElement ? pl.getElement() : pl._path;
  if(el){
    el.classList.toggle('rl-working',status==='작업중');
  }
}

/* ═══════════════════════════════════════════
   ROUTE CARDS
═══════════════════════════════════════════ */
function buildCards(){
  document.getElementById('cards').innerHTML=ROUTES.map(r=>`
    <div class="rcard" id="rcard-${r.id}" onclick="focusRoute(${r.id})">
      <div class="rdot" style="background:${r.color}"></div>
      <span class="rnum">${r.id}</span>
      <div class="rinfo">
        <div class="rname">${r.name}</div>
        <div class="rlbl">${r.label}</div>
      </div>
      <span class="rkm">${r.km}km</span>
      <div class="rbg" onclick="event.stopPropagation()">
        <button class="rbtn on-wt" id="rb-${r.id}-대기"   onclick="setStatus(${r.id},'대기')">대기</button>
        <button class="rbtn"       id="rb-${r.id}-작업중" onclick="setStatus(${r.id},'작업중')">작업중</button>
        <button class="rbtn"       id="rb-${r.id}-완료"   onclick="setStatus(${r.id},'완료')">완료</button>
      </div>
    </div>
  `).join('');
}

function updateCard(id,status){
  const card=document.getElementById(`rcard-${id}`);
  if(card){
    card.className=`rcard${status==='작업중'?' working':status==='완료'?' done':''}`;
  }
  ['대기','작업중','완료'].forEach(s=>{
    const b=document.getElementById(`rb-${id}-${s}`);
    if(!b) return;
    b.className=`rbtn${s===status?(s==='작업중'?' on-w':s==='완료'?' on-d':' on-wt'):''}`;
  });
}

function updateProgress(){
  const doneKm=ROUTES.filter(r=>statuses[r.id]==='완료').reduce((s,r)=>s+r.km,0);
  const done=Object.values(statuses).filter(s=>s==='완료').length;
  document.getElementById('pbar-fill').style.width=(doneKm/TOTAL_KM*100)+'%';
  document.getElementById('pbar-txt').textContent=done+'/7';
  document.getElementById('hud-km').textContent=doneKm.toFixed(1)+'/'+TOTAL_KM+'km';
}

function focusCard(id){
  const el=document.getElementById(`rcard-${id}`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function focusRoute(id){
  const pl=polylines[id];
  if(pl) map.flyToBounds(pl.getBounds(),{padding:[40,40],duration:.6});
}

/* ═══════════════════════════════════════════
   STATUS CHANGE
═══════════════════════════════════════════ */
function setStatus(id,status){
  if(!db){ showToast('⚡ 실시간 연결 중...'); return; }
  const prev=statuses[id];
  statuses[id]=status;
  updateCard(id,status);
  applyRouteStyle(id,status);
  updateProgress();
  if(status==='완료'&&prev!=='완료') fireBurst();
  showSync();
  db.collection('routes').doc(String(id)).set({
    status,
    worker:userName||'익명',
    updatedAt:Date.now(),
  }).catch(e=>{
    console.error('write fail',e);
    // Revert on error
    statuses[id]=prev;
    updateCard(id,prev);
    applyRouteStyle(id,prev);
    updateProgress();
    showToast('⚠️ 저장 실패 (권한 확인)');
  });
}

/* ═══════════════════════════════════════════
   GPS TRACKING
═══════════════════════════════════════════ */
function toggleGps(){
  if(gpsActive){ stopGps(); return; }
  if(!userId){ showToast('GPS는 claude.ai 로그인 필요'); return; }
  if(!userName){
    document.getElementById('modal-name').hidden=false;
    setTimeout(()=>document.getElementById('name-inp').focus(),120);
  } else {
    startGps();
  }
}
function cancelName(){
  document.getElementById('modal-name').hidden=true;
}
function confirmName(){
  const v=document.getElementById('name-inp').value.trim();
  if(!v){ document.getElementById('name-inp').focus(); return; }
  userName=v;
  try{localStorage.setItem('snow_wname',v);}catch(e){}
  document.getElementById('modal-name').hidden=true;
  startGps();
}
function startGps(){
  if(!navigator.geolocation){ showToast('GPS 미지원 기기'); return; }
  gpsActive=true;
  document.getElementById('gps-btn').textContent='📍 공유 중';
  document.getElementById('gps-btn').classList.add('gps-on');
  gpsWatchId=navigator.geolocation.watchPosition(
    pos=>{
      if(!db||!userId) return;
      db.collection('workers').doc(userId).set({
        name:userName,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        active:true,
        updatedAt:Date.now(),
      });
    },
    err=>{
      showToast('GPS 오류: '+err.message);
      stopGps();
    },
    {enableHighAccuracy:true,maximumAge:15000,timeout:30000}
  );
}
function stopGps(){
  gpsActive=false;
  if(gpsWatchId!==null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; }
  document.getElementById('gps-btn').textContent='📍 위치 공유';
  document.getElementById('gps-btn').classList.remove('gps-on');
  if(db&&userId){
    db.collection('workers').doc(userId).set({active:false,updatedAt:Date.now(),name:userName||''});
  }
}

/* ═══════════════════════════════════════════
   WORKER MARKERS
═══════════════════════════════════════════ */
function mkWorkerIcon(name,isMe){
  return L.divIcon({
    html:`<div class="w-icon ${isMe?'me':'other'}">${(name||'?')[0]}</div>`,
    className:'',iconSize:[32,32],iconAnchor:[16,16],
  });
}
function handleWorkers(snap){
  const now=Date.now();
  const active=new Set();
  snap.docs.forEach(doc=>{
    const d=doc.data();
    if(!d.active||!d.lat||!d.lng) return;
    if(now-(d.updatedAt||0)>5*60*1000) return;
    active.add(doc.id);
    const isMe=doc.id===userId;
    if(workerMarkers[doc.id]){
      workerMarkers[doc.id].setLatLng([d.lat,d.lng]);
      workerMarkers[doc.id].setIcon(mkWorkerIcon(d.name,isMe));
    } else {
      const m=L.marker([d.lat,d.lng],{icon:mkWorkerIcon(d.name,isMe),zIndexOffset:isMe?1000:500});
      m.bindPopup(`<b>${d.name}</b>${isMe?'<br>(나)':''}`);
      m.addTo(map);
      workerMarkers[doc.id]=m;
    }
  });
  Object.keys(workerMarkers).forEach(wid=>{
    if(!active.has(wid)){ workerMarkers[wid].remove(); delete workerMarkers[wid]; }
  });
}

/* ═══════════════════════════════════════════
   DB INIT
═══════════════════════════════════════════ */
async function initDb(){
  // Get user ID (for GPS)
  try{
    const uApi=await claude.use('user');
    if(uApi) userId=await uApi.id();
  } catch(e){}

  // Load saved name
  try{ userName=localStorage.getItem('snow_wname'); } catch(e){}

  // Connect db
  try{
    db=await claude.use('db');
  } catch(e){ db=null; }

  if(!db){
    setBadge('err','오프라인');
    return;
  }
  setBadge('ok','실시간 연결');

  // Listen routes
  db.collection('routes').onSnapshot(snap=>{
    snap.docs.forEach(doc=>{
      const id=parseInt(doc.id);
      if(id>=1&&id<=7){
        const s=doc.data().status||'대기';
        statuses[id]=s;
        updateCard(id,s);
        applyRouteStyle(id,s);
      }
    });
    updateProgress();
  }, err=>{ console.error('routes snap',err); setBadge('err','오류'); });

  // Listen workers
  db.collection('workers').onSnapshot(handleWorkers,
    err=>console.error('workers snap',err));
}

/* ═══════════════════════════════════════════
   SNOWFLAKES
═══════════════════════════════════════════ */
function createSnow(){
  const c=document.getElementById('snow');
  const chars=['❄','❅','❆'];
  for(let i=0;i<22;i++){
    const f=document.createElement('span');
    f.className='flake';
    f.textContent=chars[i%3];
    f.style.cssText=`
      left:${Math.random()*100}%;
      font-size:${7+Math.random()*11}px;
      opacity:${0.1+Math.random()*0.3};
      animation-duration:${8+Math.random()*14}s;
      animation-delay:-${Math.random()*18}s;
    `;
    c.appendChild(f);
  }
}

/* ═══════════════════════════════════════════
   PANEL DRAG (resize)
═══════════════════════════════════════════ */
(()=>{
  const panel=document.getElementById('panel');
  const drag=document.getElementById('panel-drag');
  let startY=0,startH=0,dragging=false;
  drag.addEventListener('touchstart',e=>{
    dragging=true;
    startY=e.touches[0].clientY;
    startH=panel.offsetHeight;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const dy=startY-e.touches[0].clientY;
    const newH=Math.min(Math.max(startH+dy,100),window.innerHeight*0.72);
    panel.style.maxHeight=newH+'px';
  },{passive:true});
  document.addEventListener('touchend',()=>{ dragging=false; });
  drag.addEventListener('mousedown',e=>{
    dragging=true;startY=e.clientY;startH=panel.offsetHeight;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const dy=startY-e.clientY;
    const newH=Math.min(Math.max(startH+dy,100),window.innerHeight*0.72);
    panel.style.maxHeight=newH+'px';
  });
  document.addEventListener('mouseup',()=>{ dragging=false; });
})();
