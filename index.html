<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여주시 제설 관리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#070f1d;--surface:#0d1a2e;--card:#0a1628;--border:#1a2e4a;
  --text:#ddeeff;--sub:#5a7ea0;--accent:#3b82f6;
  --green:#10b981;--orange:#f59e0b;--red:#ef4444;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',system-ui,sans-serif}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

/* ── MAP (always full-screen) ── */
#map{position:fixed;inset:0;z-index:1}

/* ── TOP BAR ── */
#top-bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,rgba(7,15,29,.95) 60%,transparent);
  pointer-events:none;
}
#top-bar>*{pointer-events:auto}
#back-btn{
  background:rgba(255,255,255,.12);border:1px solid var(--border);
  color:var(--text);font-size:1.3rem;width:36px;height:36px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#back-btn:hover{background:rgba(255,255,255,.2)}
#top-info{flex:1;min-width:0}
#top-title{
  font-size:1rem;font-weight:900;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#top-sub{font-size:.68rem;color:var(--sub);margin-top:1px}
#conn-badge{
  background:var(--green);color:#fff;border:none;
  font-size:.65rem;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0;
}

/* ── BOTTOM PANEL ── */
#bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(10,22,40,.97);
  border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  backdrop-filter:blur(10px);
}
.panel-drag{
  width:36px;height:4px;background:rgba(255,255,255,.15);
  border-radius:2px;margin:8px auto 4px;
}

/* ── HUB PANEL ── */
#hub-panel{padding:0 10px 12px}
#emd-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  max-height:40vh;overflow-y:auto;padding:4px 0;
}
@media(min-width:600px){#emd-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){#emd-grid{grid-template-columns:repeat(6,1fr)}}
.emd-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:.2s;animation:fadeUp .3s both;
}
.emd-card.ready{cursor:pointer}
.emd-card.ready:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(59,130,246,.2)}
.emd-card.dim{opacity:.35;cursor:default}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.emd-ico{font-size:1.5rem}
.emd-nm{font-size:.75rem;font-weight:800;text-align:center}
.emd-pbar-wrap{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.emd-pbar{height:100%;background:var(--green);border-radius:2px;transition:width .6s}
.emd-pct{font-size:.6rem;color:var(--sub);text-align:center}
.emd-pct.dim-txt{color:rgba(90,126,160,.35)}

/* ── DET PANEL ── */
#det-panel{display:flex;flex-direction:column;max-height:52vh}
.det-header{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#det-nm{flex:1;font-size:.9rem;font-weight:700}
#prog-text{font-size:.68rem;color:var(--sub);flex-shrink:0}
.prog-wrap{height:4px;background:rgba(255,255,255,.05);flex-shrink:0}
#prog-bar{height:100%;background:linear-gradient(90deg,var(--green),#06d6a0);transition:width .5s}
.user-row{display:flex;align-items:center;gap:5px;padding:7px 14px;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--sub);flex-shrink:0}
#worker-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--sub);font-size:.62rem;padding:3px 7px;border-radius:5px}
.sm-btn:hover{background:rgba(255,255,255,.12)}
#route-list{overflow-y:auto;flex:1}

/* Route items */
.r-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(26,46,74,.4);cursor:pointer;transition:background .15s}
.r-item:hover{background:rgba(255,255,255,.04)}
.r-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid currentColor}
.r-info{flex:1;min-width:0}
.r-nm{font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-road{font-size:.64rem;color:var(--sub);margin-top:1px}
.r-km{font-size:.64rem;color:var(--sub);flex-shrink:0}
.status-badge{font-size:.6rem;padding:2px 7px;border-radius:10px;font-weight:600;border:1px solid;flex-shrink:0}
.status-badge.waiting{color:var(--sub);border-color:var(--border);background:rgba(26,46,74,.4)}
.status-badge.working{color:var(--orange);border-color:var(--orange);background:rgba(245,158,11,.12)}
.status-badge.done{color:var(--green);border-color:var(--green);background:rgba(16,185,129,.12)}

/* ── STATUS BOTTOM SHEET ── */
#status-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:var(--surface);border-top:2px solid var(--border);
  border-radius:18px 18px 0 0;padding:16px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.25,.46,.45,.94);
}
#status-sheet.open{transform:translateY(0)}
#sheet-nm{font-size:.85rem;font-weight:700;margin-bottom:14px;color:var(--sub)}
.sheet-btns{display:flex;gap:8px;margin-bottom:12px}
.sht-btn{flex:1;padding:12px 6px;border-radius:10px;border:2px solid;font-size:.8rem;font-weight:700;background:transparent;color:inherit;cursor:pointer}
.sht-btn.waiting{color:var(--sub);border-color:var(--border)}
.sht-btn.working{color:var(--orange);border-color:var(--orange)}
.sht-btn.done{color:var(--green);border-color:var(--green)}
.sht-btn.active.waiting{background:var(--sub);color:#fff}
.sht-btn.active.working{background:var(--orange);color:#fff}
.sht-btn.active.done{background:var(--green);color:#fff}
#sheet-cancel{width:100%;padding:10px;border-radius:8px;border:none;background:rgba(255,255,255,.07);color:var(--sub);font-size:.82rem;cursor:pointer}
#sheet-cancel:hover{background:rgba(255,255,255,.12)}
#sheet-overlay{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.4)}

/* ── MODALS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:300px}
.modal-box h3{font-size:1rem;margin-bottom:16px}
.modal-box input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:.9rem;margin-bottom:12px}
.modal-box input:focus{outline:none;border-color:var(--accent)}
.modal-btn{width:100%;padding:10px;border-radius:8px;border:none;font-size:.88rem;font-weight:700;cursor:pointer}
.modal-btn.primary{background:var(--accent);color:#fff}
.modal-btn.secondary{background:rgba(255,255,255,.07);color:var(--sub);margin-top:8px}

/* ── ERR BAR ── */
#err-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(239,68,68,.2);border-top:1px solid var(--red);
  color:var(--red);font-size:.75rem;padding:10px 16px;
  text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;
}
</style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- TOP BAR -->
<div id="top-bar">
  <button id="back-btn" hidden>‹</button>
  <div id="top-info">
    <div id="top-title">🌨 여주시 제설 관리</div>
    <div id="top-sub">담당 읍면동을 선택하세요</div>
  </div>
  <button id="conn-badge">실시간 연결</button>
</div>

<!-- BOTTOM PANEL -->
<div id="bottom">
  <div class="panel-drag"></div>

  <!-- Hub: area grid -->
  <div id="hub-panel">
    <div id="emd-grid"></div>
  </div>

  <!-- Det: route list -->
  <div id="det-panel" hidden>
    <div class="det-header">
      <div id="det-nm"></div>
      <div id="prog-text">-</div>
    </div>
    <div class="prog-wrap"><div id="prog-bar" style="width:0%"></div></div>
    <div class="user-row">
      <span id="worker-label">이름: 없음</span>
      <button class="sm-btn" id="gps-btn">📍 위치</button>
      <button class="sm-btn" id="lock-btn">🔒 잠김</button>
      <button class="sm-btn" id="name-btn">✏️ 이름</button>
    </div>
    <div id="route-list"></div>
  </div>
</div>

<!-- Status bottom sheet -->
<div id="sheet-overlay" hidden></div>
<div id="status-sheet">
  <div id="sheet-nm"></div>
  <div class="sheet-btns">
    <button class="sht-btn waiting" data-s="waiting">대기</button>
    <button class="sht-btn working" data-s="working">작업중</button>
    <button class="sht-btn done" data-s="done">완료</button>
  </div>
  <button id="sheet-cancel">닫기</button>
</div>

<!-- PW modal -->
<div class="modal-bg" id="modal-pw" hidden>
  <div class="modal-box">
    <h3>🔐 담당자 비밀번호</h3>
    <input type="password" id="pw-input" placeholder="비밀번호 입력">
    <button class="modal-btn primary" id="pw-ok">확인</button>
    <button class="modal-btn secondary" id="pw-cancel">취소</button>
  </div>
</div>

<!-- Name modal -->
<div class="modal-bg" id="modal-name" hidden>
  <div class="modal-box">
    <h3>👤 작업자 이름</h3>
    <input type="text" id="name-input" placeholder="이름 입력">
    <button class="modal-btn primary" id="name-ok">확인</button>
    <button class="modal-btn secondary" id="name-cancel">취소</button>
  </div>
</div>

<!-- Error bar -->
<div id="err-bar" hidden>⚠ <span id="err-msg"></span></div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
/* ═══ CONFIG ═══ */
const EMD_LIST = [
  {name:'가남읍',    ready:false, center:[37.167,127.611]},
  {name:'점동면',    ready:false, center:[37.249,127.656]},
  {name:'세종대왕면', ready:true,  center:[37.278,127.573]},
  {name:'흥천면',    ready:false, center:[37.332,127.558]},
  {name:'금사면',    ready:false, center:[37.374,127.524]},
  {name:'산북면',    ready:false, center:[37.418,127.605]},
  {name:'대신면',    ready:false, center:[37.336,127.661]},
  {name:'북내면',    ready:false, center:[37.370,127.705]},
  {name:'강천면',    ready:true,  center:[37.274,127.700]},
  {name:'여흥동',    ready:true,  center:[37.299,127.631]},
  {name:'중앙동',    ready:false, center:[37.296,127.643]},
  {name:'오학동',    ready:false, center:[37.312,127.665]},
];
const PW = {
  '가남읍':'rkska3347!',   '점동면':'wjaehd3828!',  '세종대왕면':'tpwhd3866!',
  '흥천면':'gmdcjs3888!',  '금사면':'rmatk3907!',   '산북면':'tkdals3927!',
  '대신면':'eotls3948!',   '북내면':'qnrso3967!',   '강천면':'rkdcjs3997!',
  '여흥동':'dugmd3772!',   '중앙동':'wnddkd3412!',  '오학동':'dhgkr3974!',
};
const COLORS = [
  '#FF3D00','#FF9100','#FFD600','#76FF03','#00E5FF','#D500F9',
  '#FF4081','#FF6D00','#AEEA00','#00B0FF','#E040FB','#00BFA5',
];
const ICONS = ['🏠','❄️','👑','❄️','❄️','❄️','❄️','❄️','❄️','🏙️','🏙️','🏙️'];
const FB_CFG = {
  apiKey:'AIzaSyBrc1ROtWM7LG_QyIEc2HfzczpH-kep9ZE',
  authDomain:'sejong-yeoju-snow-map.firebaseapp.com',
  databaseURL:'https://sejong-yeoju-snow-map-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'sejong-yeoju-snow-map',
  storageBucket:'sejong-yeoju-snow-map.firebasestorage.app',
  messagingSenderId:'179788081279',
  appId:'1:179788081279:web:1f613a22355680b2f9374a',
};

/* ═══ STATE ═══ */
let curEmd = null;
let isLocked = true;
let workerName = localStorage.getItem('wname') || '';
let geoLayers = [];
let gpsMarker = null, gpsWatch = null, gpsOn = false;
let curRoutes = [];
let detListener = null;
let sheetRouteId = null;
let hubListeners = {};

/* ═══ FIREBASE ═══ */
firebase.initializeApp(FB_CFG);
const rtdb = firebase.database();

/* ═══ MAP ═══ */
const map = L.map('map',{zoomControl:false}).setView([37.3,127.63],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

/* ═══ HUB ═══ */
function renderHub(){
  const grid = document.getElementById('emd-grid');
  grid.innerHTML = '';
  EMD_LIST.forEach((e,i)=>{
    const div = document.createElement('div');
    div.className = 'emd-card'+(e.ready?' ready':' dim');
    div.dataset.name = e.name;
    div.style.animationDelay = (i*0.04)+'s';
    div.innerHTML = `
      <div class="emd-ico">${ICONS[i]}</div>
      <div class="emd-nm">${e.name}</div>
      <div class="emd-pbar-wrap"><div class="emd-pbar" id="pb-${e.name}" style="width:0%"></div></div>
      <div class="emd-pct${e.ready?'':' dim-txt'}" id="pct-${e.name}">${e.ready?'대기 중':'자료 준비 중'}</div>`;
    if(e.ready) div.addEventListener('click',()=>openEmd(e.name));
    grid.appendChild(div);
  });
}

function attachHubListeners(){
  EMD_LIST.filter(e=>e.ready).forEach(e=>{
    const ref = rtdb.ref('routes/'+e.name);
    const cb = ref.on('value', snap=>{
      if(!snap.exists()) return;
      const routes = Object.values(snap.val());
      const done = routes.filter(r=>r.status==='done').length;
      const pct = routes.length ? Math.round(done/routes.length*100) : 0;
      const pbar = document.getElementById('pb-'+e.name);
      const pct_el = document.getElementById('pct-'+e.name);
      if(pbar) pbar.style.width = pct+'%';
      if(pct_el) pct_el.textContent = pct+'% 완료 ('+done+'/'+routes.length+')';
    });
    hubListeners[e.name] = {ref, cb};
  });
}

function detachHubListeners(){
  Object.values(hubListeners).forEach(({ref,cb})=>ref.off('value',cb));
  hubListeners = {};
}

/* ═══ OPEN AREA ═══ */
async function openEmd(name){
  const emd = EMD_LIST.find(e=>e.name===name);
  if(!emd||!emd.ready) return;
  curEmd = name;

  document.getElementById('hub-panel').hidden = true;
  document.getElementById('det-panel').hidden = false;
  document.getElementById('back-btn').hidden = false;
  document.getElementById('top-sub').textContent = name+' 제설 현황';
  document.getElementById('det-nm').textContent = name;

  try{
    const r = await fetch(encodeURIComponent(name)+'.geojson');
    if(!r.ok) throw new Error();
    const geo = await r.json();
    loadGeo(geo);
  }catch(e){
    showErr('노선 데이터를 불러올 수 없습니다');
  }

  attachDetListener(name);
}

function goHub(){
  curEmd = null;
  detachDetListener();
  clearLayers();
  stopGps();
  document.getElementById('det-panel').hidden = true;
  document.getElementById('hub-panel').hidden = false;
  document.getElementById('back-btn').hidden = true;
  document.getElementById('top-sub').textContent = '담당 읍면동을 선택하세요';
  map.flyTo([37.3,127.63],11,{duration:1});
}

/* ═══ GEO / MAP ═══ */
function loadGeo(geo){
  clearLayers();
  curRoutes = geo.features.map((f,i)=>({
    id: f.properties.id ?? i+1,
    name: f.properties.name||f.properties.nm||`노선 ${i+1}`,
    road: f.properties.road||f.properties.도로명||f.properties.nm||'',
    km: f.properties.km||f.properties.distance||0,
    latlngs: f.geometry.coordinates.map(c=>[c[1],c[0]]),
    color: COLORS[i%COLORS.length],
    status:'waiting',
    worker:'',
  }));
  geoLayers = curRoutes.map((r,i)=>{
    const poly = L.polyline(r.latlngs,{color:r.color,weight:5,opacity:.85});
    poly.on('click',()=>openSheet(r.id));
    return poly.addTo(map);
  });
  if(geoLayers.length){
    const grp = L.featureGroup(geoLayers);
    map.flyToBounds(grp.getBounds(),{
      paddingTopLeft:[20,60],paddingBottomRight:[20,document.getElementById('bottom').offsetHeight+20],
      duration:1,
    });
  }
  renderRouteList();
}

function clearLayers(){
  geoLayers.forEach(l=>map.removeLayer(l));
  geoLayers=[];
  curRoutes=[];
  document.getElementById('route-list').innerHTML='';
}

/* ═══ ROUTE LIST ═══ */
function renderRouteList(){
  const list = document.getElementById('route-list');
  list.innerHTML = curRoutes.map(r=>`
    <div class="r-item" data-id="${r.id}" onclick="openSheet(${r.id})">
      <div class="r-dot" style="color:${r.color}"></div>
      <div class="r-info">
        <div class="r-nm">${r.name}</div>
        <div class="r-road">${r.road}</div>
      </div>
      <div class="r-km">${r.km?r.km.toFixed(1)+'km':''}</div>
      <div class="status-badge ${r.status}" id="badge-${r.id}">${statusLabel(r.status)}</div>
    </div>`).join('');
  updateProgress();
}

function updateRouteUI(id,status,worker){
  const r = curRoutes.find(r=>r.id==id);
  if(!r) return;
  r.status=status;
  r.worker=worker||'';
  const badge = document.getElementById('badge-'+id);
  if(badge){badge.className='status-badge '+status;badge.textContent=statusLabel(status);}
  const poly = geoLayers[curRoutes.indexOf(r)];
  if(poly) poly.setStyle({opacity:status==='done'?0.35:0.85});
  updateProgress();
}

function updateProgress(){
  const total = curRoutes.length;
  const done = curRoutes.filter(r=>r.status==='done').length;
  const pct = total?Math.round(done/total*100):0;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-text').textContent=pct+'% ('+done+'/'+total+')';
}

function statusLabel(s){
  return s==='waiting'?'대기':s==='working'?'작업중':'완료';
}

/* ═══ FIREBASE DET LISTENER ═══ */
function attachDetListener(name){
  detachDetListener();
  const ref = rtdb.ref('routes/'+name);
  detListener = {ref};
  detListener.cb = ref.on('value', snap=>{
    if(!snap.exists()) return;
    Object.entries(snap.val()).forEach(([id,v])=>{
      updateRouteUI(id,v.status||'waiting',v.worker);
    });
  });
}
function detachDetListener(){
  if(detListener){detListener.ref.off('value',detListener.cb);detListener=null;}
}

/* ═══ STATUS SHEET ═══ */
function openSheet(id){
  if(isLocked){openPw(()=>openSheet(id));return;}
  const r = curRoutes.find(r=>r.id==id);
  if(!r) return;
  sheetRouteId = id;
  document.getElementById('sheet-nm').textContent = r.name;
  document.querySelectorAll('.sht-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.s===r.status);
  });
  document.getElementById('status-sheet').classList.add('open');
  document.getElementById('sheet-overlay').hidden = false;
}
function closeSheet(){
  document.getElementById('status-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').hidden = true;
  sheetRouteId = null;
}
document.querySelectorAll('.sht-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    if(sheetRouteId==null) return;
    setStatus(sheetRouteId,b.dataset.s);
    closeSheet();
  });
});
document.getElementById('sheet-cancel').addEventListener('click',closeSheet);
document.getElementById('sheet-overlay').addEventListener('click',closeSheet);

function setStatus(id,status){
  if(!curEmd) return;
  rtdb.ref('routes/'+curEmd+'/'+id).update({
    status,worker:workerName,updatedAt:Date.now()
  });
}

/* ═══ GPS ═══ */
document.getElementById('gps-btn').addEventListener('click',toggleGps);
function toggleGps(){
  if(gpsOn){stopGps();return;}
  if(!navigator.geolocation){alert('위치 서비스를 지원하지 않습니다');return;}
  gpsOn=true;
  document.getElementById('gps-btn').textContent='📍 ON';
  gpsWatch = navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(gpsMarker) gpsMarker.setLatLng(ll);
    else gpsMarker = L.circleMarker(ll,{radius:8,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:.8}).addTo(map);
    map.panTo(ll);
  },()=>stopGps(),{enableHighAccuracy:true});
}
function stopGps(){
  gpsOn=false;
  document.getElementById('gps-btn').textContent='📍 위치';
  if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;}
  if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
}

/* ═══ LOCK ═══ */
document.getElementById('lock-btn').addEventListener('click',toggleLock);
function toggleLock(){
  if(isLocked) openPw(()=>{isLocked=false;document.getElementById('lock-btn').textContent='🔓 잠금해제';});
  else{isLocked=true;document.getElementById('lock-btn').textContent='🔒 잠김';}
}

/* ═══ PW MODAL ═══ */
let pwCallback = null;
function openPw(cb){
  pwCallback=cb;
  document.getElementById('pw-input').value='';
  document.getElementById('modal-pw').hidden=false;
  setTimeout(()=>document.getElementById('pw-input').focus(),50);
}
document.getElementById('pw-ok').addEventListener('click',confirmPw);
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmPw();});
document.getElementById('pw-cancel').addEventListener('click',()=>{document.getElementById('modal-pw').hidden=true;pwCallback=null;});
function confirmPw(){
  const val = document.getElementById('pw-input').value;
  if(curEmd && val===PW[curEmd]){
    document.getElementById('modal-pw').hidden=true;
    if(pwCallback){pwCallback();pwCallback=null;}
  }else{
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').placeholder='비밀번호가 틀렸습니다';
    setTimeout(()=>document.getElementById('pw-input').placeholder='비밀번호 입력',1500);
  }
}

/* ═══ NAME MODAL ═══ */
document.getElementById('name-btn').addEventListener('click',openNameModal);
function openNameModal(){
  document.getElementById('name-input').value=workerName;
  document.getElementById('modal-name').hidden=false;
  setTimeout(()=>document.getElementById('name-input').focus(),50);
}
document.getElementById('name-ok').addEventListener('click',confirmName);
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();});
document.getElementById('name-cancel').addEventListener('click',()=>document.getElementById('modal-name').hidden=true);
function confirmName(){
  const v = document.getElementById('name-input').value.trim();
  if(!v) return;
  workerName=v;
  localStorage.setItem('wname',v);
  document.getElementById('worker-label').textContent='이름: '+v;
  document.getElementById('modal-name').hidden=true;
}

/* ═══ BACK / CONN ═══ */
document.getElementById('back-btn').addEventListener('click',goHub);
document.getElementById('conn-badge').addEventListener('click',()=>{
  rtdb.ref('.info/connected').once('value',s=>{
    alert(s.val()?'Firebase 연결됨':'연결 안됨');
  });
});

/* ═══ ERR ═══ */
function showErr(msg){
  document.getElementById('err-msg').textContent=msg;
  document.getElementById('err-bar').hidden=false;
  setTimeout(()=>document.getElementById('err-bar').hidden=true,4000);
}

/* ═══ INIT ═══ */
if(workerName) document.getElementById('worker-label').textContent='이름: '+workerName;
renderHub();
attachHubListeners();
</script>
</body>
</html>
