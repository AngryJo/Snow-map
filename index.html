<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여주시 제설 관리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#070f1d;--surface:#0d1a2e;--card:#0a1628;--border:#1a2e4a;
  --text:#ddeeff;--sub:#5a7ea0;--accent:#3b82f6;
  --green:#10b981;--orange:#f59e0b;--red:#ef4444;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',system-ui,sans-serif}
button{cursor:pointer;font-family:inherit;border:none}
input{font-family:inherit}

/* MAP always full-screen */
#map{position:fixed;inset:0;z-index:1}

/* TOP BAR */
#top-bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(7,15,29,.96) 70%,transparent);
  pointer-events:none;
}
#top-bar>*{pointer-events:auto}
#back-btn{
  background:rgba(255,255,255,.12);border:1px solid var(--border);
  color:var(--text);font-size:1.3rem;width:36px;height:36px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#back-btn:hover{background:rgba(255,255,255,.2)}
#top-info{flex:1;min-width:0}
#top-title{
  font-size:.95rem;font-weight:900;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;
}
#top-sub{font-size:.62rem;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Control buttons - always visible */
.ctrl-btn{
  background:rgba(13,26,46,.9);border:1px solid var(--border);
  color:var(--text);font-size:.72rem;padding:5px 8px;border-radius:8px;
  display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;
}
.ctrl-btn:hover{background:rgba(26,46,74,.9)}
.ctrl-btn.active{border-color:var(--accent);color:var(--accent)}
#conn-badge{
  background:var(--green);color:#fff;
  font-size:.62rem;font-weight:700;padding:5px 9px;border-radius:8px;flex-shrink:0;
}

/* BOTTOM PANEL */
#bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(10,22,40,.96);
  border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  backdrop-filter:blur(12px);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
#bottom.collapsed{
  transform:translateY(calc(100% - 44px));
}
.drag-handle-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0 5px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
#bottom.collapsed .drag-handle-wrap{
  border-bottom-color:rgba(26,46,74,.5);
}
.drag-handle{width:32px;height:3px;background:rgba(255,255,255,.18);border-radius:2px}
.panel-arrow{
  font-size:.6rem;color:var(--sub);margin-top:3px;
  transition:transform .32s cubic-bezier(.4,0,.2,1);line-height:1;
}
#bottom.collapsed .panel-arrow{transform:rotate(180deg)}

/* HUB PANEL */
#hub-panel{padding:0}
#hub-actions{display:flex;gap:8px;padding:10px 12px 8px;border-bottom:1px solid rgba(26,46,74,.4)}
.reset-btn{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:9px;font-size:.75rem;font-weight:700;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.4);color:var(--red);
}
.reset-btn:hover{background:rgba(239,68,68,.18)}
#reset-emd-btn{
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);
  color:var(--red);font-size:.68rem;font-weight:700;
  padding:3px 9px;border-radius:7px;flex-shrink:0;
}
#reset-emd-btn:hover{background:rgba(239,68,68,.2)}
#emd-grid{padding:8px 8px 10px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  max-height:38vh;overflow-y:auto;padding:2px 0;
}
@media(min-width:600px){#emd-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){#emd-grid{grid-template-columns:repeat(6,1fr)}}
.emd-card{
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:.2s;animation:fadeUp .3s both;
}
.emd-card.ready{cursor:pointer}
.emd-card.ready:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(59,130,246,.2)}
.emd-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.3)}
.emd-card.dim{opacity:.3;cursor:default}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.emd-ico{font-size:1.3rem}
.emd-nm{font-size:.7rem;font-weight:800;text-align:center}
.emd-pbar-wrap{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.emd-pbar{height:100%;background:var(--green);border-radius:2px;transition:width .6s}
.emd-pct{font-size:.58rem;text-align:center}

/* DET PANEL */
#det-panel{display:flex;flex-direction:column;max-height:50vh}
.det-header{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#det-nm{flex:1;font-size:.85rem;font-weight:700}
#prog-text{font-size:.65rem;color:var(--sub)}
.prog-wrap{height:4px;background:rgba(255,255,255,.05);flex-shrink:0}
#prog-bar{height:100%;background:linear-gradient(90deg,var(--green),#06d6a0);transition:width .5s}
#route-list{overflow-y:auto;flex:1}

.r-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(26,46,74,.4);cursor:pointer;transition:background .15s}
.r-item:hover{background:rgba(255,255,255,.04)}
.r-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid currentColor}
.r-info{flex:1;min-width:0}
.r-nm{font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-road{font-size:.62rem;color:var(--sub);margin-top:1px}
.r-km{font-size:.62rem;color:var(--sub);flex-shrink:0}
.r-wk{font-size:.6rem;color:var(--orange);flex-shrink:0;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-badge{font-size:.58rem;padding:2px 6px;border-radius:9px;font-weight:600;border:1px solid;flex-shrink:0}
.status-badge.waiting{color:var(--sub);border-color:var(--border);background:rgba(26,46,74,.4)}
.status-badge.working{color:var(--orange);border-color:var(--orange);background:rgba(245,158,11,.12)}
.status-badge.done{color:var(--green);border-color:var(--green);background:rgba(16,185,129,.12)}

/* ACCORDION EXPAND */
.r-expand{
  padding:10px 12px 12px;
  background:rgba(0,0,0,.25);
  border-bottom:1px solid rgba(26,46,74,.5);
}
.ex-btns{display:flex;gap:8px}
.sht-btn{flex:1;padding:10px 4px;border-radius:9px;border:2px solid;font-size:.78rem;font-weight:700;background:transparent;color:inherit;cursor:pointer;transition:.15s}
.sht-btn.waiting{color:var(--sub);border-color:var(--border)}
.sht-btn.working{color:var(--orange);border-color:var(--orange)}
.sht-btn.done{color:var(--green);border-color:var(--green)}
.sht-btn.active.waiting{background:rgba(90,126,160,.3);color:var(--text)}
.sht-btn.active.working{background:rgba(245,158,11,.2);color:var(--orange)}
.sht-btn.active.done{background:rgba(16,185,129,.2);color:var(--green)}
.r-chevron{font-size:1rem;color:var(--sub);flex-shrink:0;transition:transform .2s;line-height:1}
.r-item.open .r-chevron{transform:rotate(90deg)}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:300px}
.modal-box h3{font-size:.95rem;margin-bottom:14px}
.modal-box input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:11px}
.modal-box input:focus{outline:none;border-color:var(--accent)}
.modal-btn{width:100%;padding:10px;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer}
.modal-btn.primary{background:var(--accent);color:#fff}
.modal-btn.secondary{background:rgba(255,255,255,.07);color:var(--sub);margin-top:7px}

/* WORKING ROUTE ANIMATION */
@keyframes workingMarch {
  to { stroke-dashoffset: -20; }
}
@keyframes workingGlow {
  0%,100%{ opacity:.8 }
  50%{ opacity:1 }
}
.working-line {
  stroke-dasharray: 12 8 !important;
  animation: workingMarch .45s linear infinite,
             workingGlow 1.1s ease-in-out infinite;
  filter: drop-shadow(0 0 5px rgba(245,158,11,.85));
}

/* LEGEND PANEL */
#legend-panel{
  position:fixed;top:56px;right:8px;z-index:15;
  background:rgba(10,22,40,0.75);
  border:1px solid rgba(26,46,74,.8);
  border-radius:12px;min-width:200px;max-width:260px;
  backdrop-filter:blur(4px);overflow:hidden;
}
#legend-header{
  display:flex;align-items:center;gap:7px;
  padding:8px 12px;cursor:pointer;user-select:none;
}
#legend-header:hover{background:rgba(255,255,255,.04)}
#legend-total-pct{
  font-size:.82rem;font-weight:800;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#legend-total-count{flex:1;font-size:.62rem;color:var(--sub)}
#legend-toggle-ico{font-size:.75rem;color:var(--sub);transition:transform .2s;line-height:1}
#legend-panel.expanded #legend-toggle-ico{transform:rotate(90deg)}
#legend-body{border-top:1px solid rgba(26,46,74,.6);padding:5px 0}
.legend-row{display:flex;align-items:center;gap:7px;padding:4px 12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-nm{font-size:.68rem;font-weight:700;flex-shrink:0;min-width:62px}
.legend-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.legend-bar{height:100%;background:var(--green);border-radius:2px;transition:width .5s}
.legend-row-pct{font-size:.58rem;color:var(--sub);flex-shrink:0;min-width:44px;text-align:right}

/* ERR BAR */
#err-bar{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(239,68,68,.9);color:#fff;font-size:.75rem;
  padding:7px 16px;border-radius:20px;white-space:nowrap;
  animation:fadeUp .2s both;
}
</style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- LEGEND PANEL (지도 위 범례 / 전체 진행률) -->
<div id="legend-panel">
  <div id="legend-header" onclick="toggleLegend()">
    <span id="legend-total-pct">0%</span>
    <span id="legend-total-count">(집계 중...)</span>
    <span id="legend-toggle-ico">›</span>
  </div>
  <div id="legend-body" hidden></div>
</div>

<!-- TOP BAR -->
<div id="top-bar">
  <button id="back-btn" hidden>‹</button>
  <div id="top-info">
    <div id="top-title">🌨 여주시 제설 관리</div>
    <div id="top-sub">전체 노선 현황</div>
  </div>
  <button id="gps-btn" class="ctrl-btn">📍 위치</button>
  <button id="lock-btn" class="ctrl-btn">🔒 잠김</button>
  <button id="name-btn" class="ctrl-btn">✏️ <span id="name-label">이름</span></button>
  <button id="conn-badge">실시간</button>
</div>

<!-- BOTTOM PANEL -->
<div id="bottom">
  <div class="drag-handle-wrap" id="panel-toggle">
    <div class="drag-handle"></div>
    <div class="panel-arrow">▼</div>
  </div>

  <!-- Hub: area grid -->
  <div id="hub-panel">
    <div id="hub-actions">
      <button class="reset-btn" id="reset-all-btn">🔄 전체 초기화</button>
    </div>
    <div id="emd-grid"></div>
  </div>

  <!-- Det: route list -->
  <div id="det-panel" hidden>
    <div class="det-header">
      <div id="det-nm"></div>
      <div id="prog-text"></div>
      <button id="reset-emd-btn">🔄 초기화</button>
    </div>
    <div class="prog-wrap"><div id="prog-bar" style="width:0%"></div></div>
    <div id="route-list"></div>
  </div>
</div>

<!-- PW modal -->
<div class="modal-bg" id="modal-pw" hidden>
  <div class="modal-box">
    <h3>🔐 담당자 비밀번호</h3>
    <input type="password" id="pw-input" placeholder="비밀번호 입력">
    <button class="modal-btn primary" id="pw-ok">확인</button>
    <button class="modal-btn secondary" id="pw-cancel">취소</button>
  </div>
</div>

<!-- Name modal -->
<div class="modal-bg" id="modal-name" hidden>
  <div class="modal-box">
    <h3>👤 작업자 이름</h3>
    <input type="text" id="name-input" placeholder="이름 입력">
    <button class="modal-btn primary" id="name-ok">확인</button>
    <button class="modal-btn secondary" id="name-cancel">취소</button>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-bg" id="modal-confirm" hidden>
  <div class="modal-box">
    <h3 id="confirm-title">확인</h3>
    <p id="confirm-msg" style="font-size:.8rem;color:var(--sub);margin-bottom:14px;line-height:1.6"></p>
    <button class="modal-btn primary" id="confirm-ok">확인</button>
    <button class="modal-btn secondary" id="confirm-cancel">취소</button>
  </div>
</div>

<!-- Error msg -->
<div id="err-bar" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
/* ═══ CONFIG ═══ */
const EMD_LIST = [
  {name:'가남읍',    ready:false, center:[37.167,127.611]},
  {name:'점동면',    ready:false, center:[37.249,127.656]},
  {name:'세종대왕면', ready:true,  center:[37.278,127.573]},
  {name:'흥천면',    ready:false, center:[37.332,127.558]},
  {name:'금사면',    ready:false, center:[37.374,127.524]},
  {name:'산북면',    ready:false, center:[37.418,127.605]},
  {name:'대신면',    ready:false, center:[37.336,127.661]},
  {name:'북내면',    ready:false, center:[37.370,127.705]},
  {name:'강천면',    ready:true,  center:[37.274,127.700]},
  {name:'여흥동',    ready:true,  center:[37.299,127.631]},
  {name:'중앙동',    ready:false, center:[37.296,127.643]},
  {name:'오학동',    ready:false, center:[37.312,127.665]},
];
const PW = {
  '가남읍':'rkska3347!',   '점동면':'wjaehd3828!',  '세종대왕면':'tpwhd3866!',
  '흥천면':'gmdcjs3888!',  '금사면':'rmatk3907!',   '산북면':'tkdals3927!',
  '대신면':'eotls3948!',   '북내면':'qnrso3967!',   '강천면':'rkdcjs3997!',
  '여흥동':'dugmd3772!',   '중앙동':'wnddkd3412!',  '오학동':'dhgkr3974!',
};
const ADMIN_PW = 'ehfhrhksfl!'; // 도로관리팀 전체 권한
const COLORS = [
  '#FF3D00','#FF9100','#FFD600','#76FF03','#00E5FF','#D500F9',
  '#FF4081','#FF6D00','#AEEA00','#00B0FF','#E040FB','#00BFA5',
];
/* 읍면동별 노선 색상 고정 (지도에서 잘 보이는 색으로 직접 지정) */
const EMD_COLORS = {
  '세종대왕면': '#FF1744',  // 선명한 빨강
  '강천면':     '#AA00FF',  // 선명한 보라
  '여흥동':     '#00B0FF',  // 하늘색 (기존 유지)
};
const ICONS = ['🏠','❄','👑','❄','❄','❄','❄','❄','❄','🏙','🏙','🏙'];
/* 세종대왕면 노선명 오버라이드 (id 순서) */
const ROUTE_NAMES = {
  '세종대왕면': {
    1:'면도106호선(번도5리~신지1리)',
    2:'도시계획도로(면소재지)',
    3:'도시계획도로(능서역세권)',
    4:'리도202호선(매류2리~광대사거리)',
    5:'면도107호선(매류2리~죽당리 경계)',
    6:'면도101호선(용은2리~양거리)',
    7:'리도211호선(양거리~수정리 경계)',
  },
};
/* GeoJSON 파일명 후보: 단순명 먼저, 원본명 fallback */
const GEO_CANDIDATES = {
  '세종대왕면': ['세종대왕면.geojson','03.세종대왕면 제설 노선도.geojson'],
  '강천면':     ['강천면.geojson','09.강천면 제설 노선도.geojson'],
  '여흥동':     ['여흥동.geojson','10.여흥동 제설 노선도.geojson'],
};
const FB_CFG = {
  apiKey:'AIzaSyBrc1ROtWM7LG_QyIEc2HfzczpH-kep9ZE',
  authDomain:'sejong-yeoju-snow-map.firebaseapp.com',
  databaseURL:'https://sejong-yeoju-snow-map-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'sejong-yeoju-snow-map',
  storageBucket:'sejong-yeoju-snow-map.firebasestorage.app',
  messagingSenderId:'179788081279',
  appId:'1:179788081279:web:1f613a22355680b2f9374a',
};

/* ═══ STATE ═══ */
let curEmd = null;          // null = hub mode
let isLocked = true;
let workerName = localStorage.getItem('wname') || '';
let gpsOn = false, gpsWatch = null, gpsMarker = null, gpsHeartbeat = null;
let pwCallback = null, expectedPw = null;
let expandedId = null;      // currently expanded route id in accordion
const mapData = {};         // {emdName: {routes[], layers[], color}}
/* 기기 고유 ID (GPS 공유용) */
const deviceId = (() => {
  let id = localStorage.getItem('wdevid');
  if(!id){ id = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); localStorage.setItem('wdevid',id); }
  return id;
})();
const workerMarkers = {};   // {deviceId: L.Marker}

/* ═══ FIREBASE ═══ */
firebase.initializeApp(FB_CFG);
const rtdb = firebase.database();

/* ═══ MAP ═══ */
const map = L.map('map',{zoomControl:false}).setView([37.3,127.63],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

/* ═══ GEOJSON FETCH ═══ */
async function fetchGeo(name){
  const candidates = GEO_CANDIDATES[name] || [name+'.geojson'];
  for(const fname of candidates){
    try{
      const r = await fetch(fname.split('').map(c=>
        c===' '?'%20':(c.charCodeAt(0)>127?encodeURIComponent(c):c)).join(''));
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}

function parseGeo(geo, emdIdx, emdName){
  const nameOvr = ROUTE_NAMES[emdName]||{};
  return geo.features.map((f,i)=>{
    const id = f.properties.id ?? i+1;
    return {
      id,
      name: nameOvr[id]||f.properties.name||f.properties.nm||`노선 ${id}`,
      road: f.properties.road||f.properties.도로명||'',
      km: parseFloat(f.properties.km||f.properties.distance||0),
      latlngs: f.geometry.coordinates.map(c=>[c[1],c[0]]),
      color: EMD_COLORS[emdName] || COLORS[emdIdx%COLORS.length],
      status: 'waiting',
      worker: '',
    };
  });
}

/* ═══ LOAD ALL GEOJSON ═══ */
async function loadAllGeo(){
  const readyList = EMD_LIST.filter(e=>e.ready);
  for(const emd of readyList){
    const emdIdx = EMD_LIST.indexOf(emd);
    const geo = await fetchGeo(emd.name);
    if(!geo){continue;}
    const routes = parseGeo(geo, emdIdx, emd.name);
    const layers = routes.map(r=>{
      const poly = L.polyline(r.latlngs,{color:r.color,weight:4,opacity:.7});
      poly.bindTooltip(emd.name+' · '+r.name,{sticky:true});
      poly.on('click',()=>{
        if(curEmd===emd.name) toggleRoute(r.id);
        else openEmd(emd.name);
      });
      return poly.addTo(map);
    });
    mapData[emd.name]={routes, layers, color:EMD_COLORS[emd.name]||COLORS[emdIdx%COLORS.length]};
  }
}

/* ═══ FIREBASE LISTENERS ═══ */
function attachAllFirebase(){
  EMD_LIST.filter(e=>e.ready).forEach(emd=>{
    rtdb.ref('routes/'+emd.name).on('value', snap=>{
      const data = snap.val()||{};
      /* update map colors */
      const md = mapData[emd.name];
      if(md){
        md.routes.forEach((r,i)=>{
          const fb = data[r.id]||data[String(r.id)];
          const st = fb?fb.status:'waiting';
          r.status=st; r.worker=(fb&&fb.worker)||'';
          const col = st==='done'?'#10b981':st==='working'?'#f59e0b':r.color;
          const inDet = curEmd===emd.name;
          md.layers[i].setStyle({
            color:col,
            weight: st==='working'?(inDet?6:5): st==='done'?(inDet?6:5): inDet?5:4,
            opacity: st==='done'?(inDet?.6:.5): inDet?.9:.7,
          });
          applyWorkingAnim(md.layers[i], st==='working');
        });
      }
      /* update hub card */
      const all = Object.values(data);
      const total = md?.routes.length || 0;  // GeoJSON 기준 전체 노선 수
      const done = all.filter(r=>r.status==='done').length;
      const pct = total?Math.round(done/total*100):0;
      const pb = document.getElementById('pb-'+emd.name);
      const pt = document.getElementById('pct-'+emd.name);
      if(pb) pb.style.width=pct+'%';
      if(pt){
        pt.textContent = total
          ? (pct===100 ? `✅ 전체 완료 (${total}/${total})`
                       : `완료 ${done}/${total} · ${pct}%`)
          : '대기 중';
        pt.style.color = pct===100?'var(--green)':pct>0?'var(--orange)':'var(--sub)';
      }
      /* update det panel if open */
      if(curEmd===emd.name){
        updateDetProgress();
        if(md) md.routes.forEach(r=>updateRouteItemDOM(r));
      }
      /* 범례 패널 전체 진행률 갱신 */
      updateLegend();
    });
  });
}

/* ═══ HUB RENDER ═══ */
function renderHub(){
  const grid = document.getElementById('emd-grid');
  grid.innerHTML='';
  EMD_LIST.forEach((e,i)=>{
    const div = document.createElement('div');
    div.className='emd-card'+(e.ready?' ready':' dim');
    div.dataset.name=e.name;
    div.style.animationDelay=(i*.03)+'s';
    div.innerHTML=`
      <div class="emd-ico">${ICONS[i]}</div>
      <div class="emd-nm">${e.name}</div>
      <div class="emd-pbar-wrap"><div class="emd-pbar" id="pb-${e.name}" style="width:0%"></div></div>
      <div class="emd-pct" id="pct-${e.name}" style="color:var(--sub)">${e.ready?'대기 중':'자료 준비 중'}</div>`;
    if(e.ready) div.addEventListener('click',()=>openEmd(e.name));

/* ═══ OPEN AREA ═══ */
function openEmd(name){
  const emd = EMD_LIST.find(e=>e.name===name);
  if(!emd||!emd.ready) return;
  curEmd = name;

  document.getElementById('hub-panel').hidden=true;
  document.getElementById('det-panel').hidden=false;
  document.getElementById('back-btn').hidden=false;
  document.getElementById('top-sub').textContent=name+' 제설 현황';
  document.getElementById('det-nm').textContent=name;

  /* highlight layers */
  refreshMapOpacity();

  if(mapData[name]){
    renderRouteList(name);
    const grp = L.featureGroup(mapData[name].layers);
    map.flyToBounds(grp.getBounds(),{
      paddingTopLeft:[20,60],
      paddingBottomRight:[20,document.getElementById('bottom').offsetHeight+16],
      duration:.8,
    });
  }else{
    document.getElementById('route-list').innerHTML='<div style="padding:20px;text-align:center;color:var(--sub);font-size:.8rem">노선 데이터 없음</div>';
  }
  updateDetProgress();

  /* highlight active card */
  document.querySelectorAll('.emd-card').forEach(c=>{
    c.classList.toggle('active',c.dataset.name===name);
  });
}

function goHub(){
  curEmd=null;
  document.getElementById('det-panel').hidden=true;
  document.getElementById('hub-panel').hidden=false;
  document.getElementById('back-btn').hidden=true;
  document.getElementById('top-sub').textContent='전체 노선 현황';
  document.querySelectorAll('.emd-card').forEach(c=>c.classList.remove('active'));
  refreshMapOpacity();
  map.flyTo([37.3,127.63],11,{duration:.8});
}

function refreshMapOpacity(){
  Object.entries(mapData).forEach(([emdName,md])=>{
    const isSelected = curEmd===emdName;
    const isHub = curEmd===null;
    md.routes.forEach((r,i)=>{
      const col = r.status==='done'?'#10b981':r.status==='working'?'#f59e0b':r.color;
      md.layers[i].setStyle({
        color:col,
        weight: r.status==='working'?(isSelected?6:5): r.status==='done'?(isSelected?6:5): isSelected?5:4,
        opacity: isHub
          ? (r.status==='done'?.5:.7)
          : isSelected
            ? (r.status==='done'?.6:.9)
            : .12,
      });
      applyWorkingAnim(md.layers[i], r.status==='working');
    });
  });
}

/* ═══ ROUTE LIST ═══ */

/* 이벤트 위임 - 한 번만 등록 */
document.getElementById('route-list').addEventListener('click', e=>{

/* 잠금 해제 공통 함수 */
function doUnlock(){
  isLocked=false;
  document.getElementById('lock-btn').textContent='🔓 해제됨';
  document.getElementById('lock-btn').classList.add('active');
}

function toggleRoute(id){
  if(isLocked){
    if(!curEmd){showErr('먼저 담당 읍면동을 선택하세요');return;}
    const snapEmd = curEmd; // 모달 열리는 시점의 읍면동 캡처
    openPw(()=>{ doUnlock(); doToggleRoute(id); }, snapEmd);
    return;
  }
  doToggleRoute(id);
}

function doToggleRoute(id){
  const prev = expandedId;
  /* 이전 항목 닫기 */
  if(prev!==null){
    const prevEx = document.getElementById('re-'+prev);
    const prevItem = document.querySelector(`.r-item[data-id="${prev}"]`);
    if(prevEx) prevEx.hidden=true;
    if(prevItem) prevItem.classList.remove('open');
  }
  if(prev===id){ expandedId=null; return; }
  /* 새 항목 열기 */
  expandedId=id;
  const ex = document.getElementById('re-'+id);
  const item = document.querySelector(`.r-item[data-id="${id}"]`);
  if(ex){ ex.hidden=false; }
  if(item){ item.classList.add('open'); }
  /* 현재 상태 하이라이트 */
  const r = mapData[curEmd]?.routes.find(r=>r.id==id);
  if(r && ex) ex.querySelectorAll('.sht-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===r.status));
}

function setRouteStatus(id, status){
  if(!curEmd) return;
  rtdb.ref('routes/'+curEmd+'/'+id).update({status, worker:workerName, updatedAt:Date.now()});
  /* 아코디언 닫기 */
  const ex = document.getElementById('re-'+id);
  const item = document.querySelector(`.r-item[data-id="${id}"]`);
  if(ex) ex.hidden=true;
  if(item) item.classList.remove('open');
  expandedId=null;
}

function updateRouteItemDOM(r){
  const badge = document.getElementById('rbadge-'+r.id);
  const dot   = document.getElementById('rdot-'+r.id);
  if(badge){ badge.textContent=sLabel(r.status); badge.className='status-badge '+r.status; }
  if(dot)  { dot.style.color=rColor(r); }
  /* 열려있는 패널의 active 상태 갱신 */
  const ex = document.getElementById('re-'+r.id);
  if(ex && !ex.hidden) ex.querySelectorAll('.sht-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===r.status));
}

function updateDetProgress(){
  if(!curEmd||!mapData[curEmd]) return;
  const routes = mapData[curEmd].routes;
  const total = routes.length;
  const done = routes.filter(r=>r.status==='done').length;
  const pct = total?Math.round(done/total*100):0;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-text').textContent=
    pct===100 ? `✅ 전체 완료 (${total}/${total})`
              : `완료 ${done}/${total} · ${pct}%`;
}

function sLabel(s){return s==='waiting'?'대기':s==='working'?'작업중':'완료';}

/* 작업중 애니메이션 토글 */
function applyWorkingAnim(layer, isWorking){
  const el = layer.getElement ? layer.getElement() : layer._path;
  if(!el) return;
  el.classList.toggle('working-line', isWorking);
}

/* ═══ LEGEND PANEL ═══ */
function toggleLegend(){
  const panel = document.getElementById('legend-panel');
  const body  = document.getElementById('legend-body');
  const isOpen = panel.classList.contains('expanded');
  panel.classList.toggle('expanded', !isOpen);
  body.hidden = isOpen;
}

function updateLegend(){
  const readyEmds = EMD_LIST.filter(e=>e.ready);
  let totalAll=0, doneAll=0;
  const rows = readyEmds.map(emd=>{
    const md = mapData[emd.name];
    if(!md) return null;
    const total = md.routes.length;
    const done  = md.routes.filter(r=>r.status==='done').length;
    totalAll += total;
    doneAll  += done;
    const pct = total ? Math.round(done/total*100) : 0;
    const color = md.color || '#60a5fa';
    return {name:emd.name, total, done, pct, color};
  }).filter(Boolean);

  const totalPct = totalAll ? Math.round(doneAll/totalAll*100) : 0;
  document.getElementById('legend-total-pct').textContent = totalPct+'%';
  document.getElementById('legend-total-count').textContent =
    `(완료 ${doneAll} / ${totalAll})`;

  const body = document.getElementById('legend-body');
  body.innerHTML = rows.map(r=>{
    const barColor = r.pct===100 ? 'var(--green)' : r.pct>0 ? 'var(--orange)' : 'rgba(255,255,255,.15)';
    return `<div class="legend-row">
      <div class="legend-dot" style="background:${r.color}"></div>
      <div class="legend-nm">${r.name}</div>
      <div class="legend-bar-wrap">
        <div class="legend-bar" style="width:${r.pct}%;background:${barColor}"></div>
      </div>
      <div class="legend-row-pct">${r.done}/${r.total}</div>
    </div>`;
  }).join('');
}

/* ═══ GPS (Firebase 실시간 공유) ═══ */
const STALE_MS = 15 * 60 * 1000; // 15분 이상 업데이트 없으면 오프라인 처리

function updateWorkerMarker(id, w){
  if(!w||w.lat==null) return;
  /* 오래된 위치는 Firebase에서 자동 삭제 후 무시 */
  if(w.updatedAt && Date.now() - w.updatedAt > STALE_MS){
    rtdb.ref('workers/'+id).remove();
    if(workerMarkers[id]){ map.removeLayer(workerMarkers[id]); delete workerMarkers[id]; }
    return;
  }
  const isMe = id===deviceId;
  const col = isMe ? '#3b82f6' : '#f59e0b';
  const icon = L.divIcon({
    className:'',
    html:`<div style="background:${col};color:#fff;font-size:10px;font-weight:800;`+
         `padding:3px 8px;border-radius:12px;white-space:nowrap;`+
         `box-shadow:0 2px 8px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.3)">`+
         `${w.name||'담당자'}${isMe?' (나)':''}</div>`,
    iconAnchor:[0,10],
  });
  if(workerMarkers[id]){
    workerMarkers[id].setLatLng([w.lat,w.lng]).setIcon(icon);
  } else {
    workerMarkers[id]=L.marker([w.lat,w.lng],{icon,zIndexOffset:500}).addTo(map);
    if(isMe) map.panTo([w.lat,w.lng]);
  }
}

function listenWorkers(){
  rtdb.ref('workers').on('child_added',  s=>updateWorkerMarker(s.key,s.val()));
  rtdb.ref('workers').on('child_changed', s=>updateWorkerMarker(s.key,s.val()));
  rtdb.ref('workers').on('child_removed', s=>{
    if(workerMarkers[s.key]){ map.removeLayer(workerMarkers[s.key]); delete workerMarkers[s.key]; }
  });
}

document.getElementById('gps-btn').addEventListener('click',()=>{
  if(gpsOn){
    gpsOn=false;
    document.getElementById('gps-btn').textContent='📍 위치';
    document.getElementById('gps-btn').classList.remove('active');
    if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;}
    if(gpsHeartbeat!=null){clearInterval(gpsHeartbeat);gpsHeartbeat=null;}
    // Firebase에서 내 위치 삭제
    rtdb.ref('workers/'+deviceId).remove();
    return;
  }
  // 잠금 해제한 작업자만 위치 공유 가능
  if(isLocked){showErr('🔒 담당 읍면동 잠금을 먼저 해제하세요');return;}
  if(!navigator.geolocation){showErr('위치 서비스 미지원');return;}
  gpsOn=true;
  document.getElementById('gps-btn').textContent='📍 ON';
  document.getElementById('gps-btn').classList.add('active');
  // 연결 끊기면 자동 삭제
  rtdb.ref('workers/'+deviceId).onDisconnect().remove();
  gpsWatch=navigator.geolocation.watchPosition(pos=>{
    // Firebase에 위치 저장 → 모든 기기에서 실시간으로 볼 수 있음
    rtdb.ref('workers/'+deviceId).set({
      lat:pos.coords.latitude,
      lng:pos.coords.longitude,
      name:workerName||'담당자',
      updatedAt:Date.now()
    });
  },()=>{
    showErr('위치를 가져올 수 없습니다');
    gpsOn=false;
    document.getElementById('gps-btn').textContent='📍 위치';
    document.getElementById('gps-btn').classList.remove('active');
    if(gpsHeartbeat!=null){clearInterval(gpsHeartbeat);gpsHeartbeat=null;}
    rtdb.ref('workers/'+deviceId).remove();
  },{enableHighAccuracy:true});
  // 1분마다 updatedAt 갱신 (위치 안 움직여도 "온라인" 상태 유지)
  gpsHeartbeat = setInterval(()=>{
    if(gpsOn) rtdb.ref('workers/'+deviceId+'/updatedAt').set(Date.now());
  }, 60000);
});

/* ═══ LOCK ═══ */
document.getElementById('lock-btn').addEventListener('click',()=>{
  if(isLocked){

});

/* ═══ PW MODAL ═══ */
// validPws: 문자열 또는 배열 — 여러 비밀번호 중 하나면 통과
function openPw(cb, forEmd, validPws){
  const emd = forEmd || curEmd;
  pwCallback = cb;
  expectedPw = validPws !== undefined ? validPws : (PW[emd] || null);
  // 헤더 타이틀 결정
  let label;
  if(!forEmd && validPws) label = '도로관리팀';
  else label = emd || '담당자';
  document.querySelector('#modal-pw h3').textContent = '🔐 ' + label + ' 비밀번호';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-input').placeholder='비밀번호 입력';
  document.getElementById('modal-pw').hidden=false;
  setTimeout(()=>document.getElementById('pw-input').focus(),60);
}
function confirmPw(){
  const val = document.getElementById('pw-input').value;
  const ok = Array.isArray(expectedPw) ? expectedPw.includes(val)
                                       : (expectedPw && val === expectedPw);
  if(ok){
    document.getElementById('modal-pw').hidden=true;
    const cb=pwCallback; pwCallback=null; expectedPw=null;
    if(cb) cb();
  }else{
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').placeholder='❌ 비밀번호가 틀렸습니다';
    setTimeout(()=>document.getElementById('pw-input').placeholder='비밀번호 입력',1800);
  }
}

/* ═══ CONFIRM MODAL ═══ */
let confirmCallback = null;
function openConfirm(title, msg, cb){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = cb;
  document.getElementById('modal-confirm').hidden = false;
}
document.getElementById('confirm-ok').addEventListener('click',()=>{
  document.getElementById('modal-confirm').hidden = true;
  const cb = confirmCallback; confirmCallback = null;
  if(cb) cb();
});
document.getElementById('confirm-cancel').addEventListener('click',()=>{
  document.getElementById('modal-confirm').hidden = true;
  confirmCallback = null;
});

/* ═══ 초기화 ═══ */
function resetAllRoutes(){
  openPw(()=>{
    openConfirm('⚠️ 전체 초기화',
      '모든 읍면동(세종대왕면·강천면·여흥동)의\n노선을 전부 대기 상태로 초기화합니다.\n계속하시겠습니까?',
      ()=>{
        const promises = EMD_LIST.filter(e=>e.ready)
          .map(e => rtdb.ref('routes/'+e.name).remove());
        Promise.all(promises).then(()=>showErr('✅ 전체 초기화 완료'));
      }
    );
  }, null, [ADMIN_PW]);
}

function resetEmdRoutes(){
  if(!curEmd) return;
  const emd = curEmd;
  const emdPw = PW[emd];
  const validPws = emdPw ? [ADMIN_PW, emdPw] : [ADMIN_PW];
  const doReset = ()=>{
    openConfirm('⚠️ '+emd+' 초기화',
      emd+'의 모든 노선을\n대기 상태로 초기화합니다.\n계속하시겠습니까?',
      ()=>{ rtdb.ref('routes/'+emd).remove().then(()=>showErr('✅ '+emd+' 초기화 완료')); }
    );
  };
  if(!isLocked){ doReset(); return; }  // 이미 인증된 경우 바로
  openPw(doReset, emd, validPws);
}

document.getElementById('reset-all-btn').addEventListener('click', resetAllRoutes);
document.getElementById('reset-emd-btn').addEventListener('click', resetEmdRoutes);
document.getElementById('pw-ok').addEventListener('click',confirmPw);
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmPw();});
document.getElementById('pw-cancel').addEventListener('click',()=>{
  document.getElementById('modal-pw').hidden=true;
  pwCallback=null; expectedPw=null;
});

  if(gpsOn) rtdb.ref('workers/'+deviceId+'/name').set(v);
}
document.getElementById('name-ok').addEventListener('click',confirmName);
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();});
document.getElementById('name-cancel').addEventListener('click',()=>document.getElementById('modal-name').hidden=true);

/* ═══ PANEL COLLAPSE ═══ */
(function(){
  const bottom = document.getElementById('bottom');
  try{ if(localStorage.getItem('panelCollapsed')==='1') bottom.classList.add('collapsed'); }catch(e){}
  document.getElementById('panel-toggle').addEventListener('click',()=>{
    bottom.classList.toggle('collapsed');
    try{ localStorage.setItem('panelCollapsed', bottom.classList.contains('collapsed')?'1':'0'); }catch(e){}
  });
})();

/* ═══ BACK / CONN ═══ */
document.getElementById('back-btn').addEventListener('click',goHub);
document.getElementById('conn-badge').addEventListener('click',()=>{
  rtdb.ref('.info/connected').once('value',s=>alert(s.val()?'✅ Firebase 연결됨':'❌ 연결 안됨'));
});

/* ═══ ERR ═══ */
let errTimer=null;
function showErr(msg){
  const el=document.getElementById('err-bar');
  el.textContent=msg; el.hidden=false;
  if(errTimer) clearTimeout(errTimer);
  errTimer=setTimeout(()=>el.hidden=true,3500);
}

/* ═══ INIT ═══ */
if(workerName) document.getElementById('name-label').textContent=workerName;
renderHub();
loadAllGeo().then(()=>{
  attachAllFirebase();
});
listenWorkers(); // 모든 담당자 위치 실시간 감지 시작
</script>
</body>
</html>
